              - generic [ref=e76]:
                - text: Display Driver Uninstaller 18.1.5.7, a stable update to its graphics-driver removal utility. Published on August 18, 2026, the release replaces version 18.1.5.6 and introduces important safeguards for DDU’s Safe Mode process, alongside more complete removal of recent Intel graphics drivers. The primary changes concern the helper service responsible for returning Windows to its regular boot configuration after DDU has restarted the computer in Safe Mode. This service is now stored in a permanent location instead of a temporary directory. The earlier implementation could be disrupted when antivirus software or a cleanup utility deleted the service executable before the computer restarted. DDU now verifies that the Windows Safe Mode boot flag has actually been removed. If the first attempt fails, the service retries instead of assuming that the operation completed successfully. Should removal continue to fail while Windows is running in Safe Mode, the helper service remains installed so it can make another attempt during the following boot.
                - paragraph [ref=e77]:
                  - text: If you have a problem installing an older driver or newer one, give it a try as there are some reports that it fix those problems. Guru3D.com is an official download partner for this handy application. We have
                  - link "AMD support thread over here" [ref=e78] [cursor=pointer]:
                    - /url: https://forums.guru3d.com/forums/videocards-amd-radeon-drivers-section.46/
                  - text: and an
                  - link "NVIDIA over here" [ref=e79] [cursor=pointer]:
                    - /url: https://forums.guru3d.com/forums/videocards-nvidia-geforce-drivers-section.21/
                  - text: .
                - paragraph [ref=e80]: DDU is designed to provide a clean system state by removing all traces of graphics drivers from NVIDIA, AMD, and Intel platforms. While typical uninstall routines remove the main driver package, they often leave behind supporting components that remain active in the operating system. These remnants can lead to driver conflicts, failed installations, or instability when upgrading to newer driver versions or switching between GPU vendors.
                - paragraph [ref=e81]: This is particularly relevant when the user cannot sign in under Safe Mode. Windows Hello PIN authentication may be unavailable in that environment, potentially leaving users without access when they do not remember the corresponding account password. Version 18.1.5.7 cancels the restart into Safe Mode if the recovery service cannot be installed, reducing the risk of leaving the computer stuck in that configuration.
                - paragraph [ref=e82]: DDU also removes service entries, registry keys and copied executables left behind by the Safe Mode helper. This cleanup includes remnants created by earlier DDU releases. A console window that previously appeared briefly while installing or removing the service should no longer be visible.
                - paragraph [ref=e83]: Intel cleanup receives two notable corrections. The IGSDSserviceDiscrete service used by Intel Arc and other discrete graphics products, together with PmtChildDriver, can now be removed correctly. DDU also recognizes the newer filenames used by current integrated and discrete Intel display-driver packages, preventing obsolete packages from remaining in the Windows driver store.
                - paragraph [ref=e84]: Logging has been improved as well. Attempting to stop a Windows service that does not accept stop requests no longer produces a misleading error. DDU now writes its log even when startup ends early because settings files are missing, Windows has a pending restart or administrator permission is refused.
                - paragraph
                - paragraph
                - paragraph [ref=e85]: DDU 18.1.5.7 supports 32-bit and 64-bit editions of Windows 7 through Windows 11 and requires .NET Framework 4.8. No release-specific known issues are documented. Wagnardsoft continues to recommend creating a restore point and using Safe Mode when possible.
                - paragraph
                - paragraph
                - paragraph [ref=e86]: DDU continues to serve as a specialized utility rather than a general-purpose uninstall tool. It is primarily intended for advanced users, system builders, and reviewers who require a fully clean driver environment. With ongoing updates to maintain compatibility with modern hardware and software, it remains a relevant tool for ensuring reliable GPU driver installations.
