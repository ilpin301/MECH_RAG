                - list [ref=e92]:
                  - listitem [ref=e93]: The tool can be used in Normal mode but for absolute stability when using DDU, Safemode is always the best.
                  - listitem [ref=e94]: Make a backup or a system restore (but it should normally be pretty safe).
                  - listitem [ref=e95]: It is best to exclude the DDU folder completely from any security software to avoid issues.
                - paragraph [ref=e96]: Keep note that NVIDIA/AMD did not have anything to do with this, I do not work at or for NVIDIA/AMD and they should not be held responsible for anything that may go wrong with this application.
