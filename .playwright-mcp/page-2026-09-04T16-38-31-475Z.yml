                - strong [ref=e120]: "Change Info:"
                - text: "Display Driver Uninstaller (DDU) V18.1.5.7 Released. Requirement: -Windows 7 up to Windows 11 -NVIDIA, AMD, Intel GPUs -Also support basic Realtek audio driver cleanup. -Microsoft .NET Framework 4.8 or higher Changelog: Safe Mode handler service - Improved : The helper service that brings the computer back out of Safe Mode is now stored in a permanent location instead of the temporary folder, where cleanup tools or antivirus could delete it before the reboot. - Improved : The service now verifies that the Safe Mode flag was really removed, and retries instead of assuming it worked. If it still fails while in Safe Mode, it stays installed so it can try again on the next boot. - Improved : The reboot into Safe Mode is now cancelled if that service could not be installed, instead of restarting anyway. This service is the only thing able to bring back a computer whose user cannot sign in while in Safe Mode (forgotten password, PIN not available there). - Added : DDU now removes the leftovers of that service on startup (service entry, registry keys and copied executable), including leftovers created by previous DDU versions. - Fixed : No more console window briefly flashing when the service is installed or removed. Intel cleanup - Fixed : Two Intel services were left behind after a cleanup: IGSDSserviceDiscrete (used by Arc / discrete graphics) and PmtChildDriver. - Fixed : Leftover display driver packages from recent Intel drivers could stay in the driver store. Only the older driver file name was recognized; the current integrated and discrete ones are now recognized as well, older drivers still are. Logs - Fixed : Trying to stop a service that does not accept stop requests no longer reports an error. It is now skipped with a clear message. - Fixed : The log file is now written when DDU exits early during startup (missing settings files, pending Windows reboot, administrator rights refused). Languages - Updated : Hungarian."
